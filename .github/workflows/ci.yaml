name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.12
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests

  mypy:
    name: Mypy (type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # mypy 1.20.2 requires librt>=0.8.0 but HA 2025.11 pins librt==0.2.1 --
      # they cannot coexist. mypy 1.18.2 has no librt dependency, hence the pin.
      # pycares 5.x breaks aiodns at import time (AttributeError: module
      # 'pycares' has no attribute 'ares_query_a_result'), hence pycares<5.
      - run: pip install mypy==1.18.2 pytest-homeassistant-custom-component==0.13.294 aioratio[ble]==0.13.0 aiousbwatcher "pycares<5"
      - run: mypy custom_components/ratio/

  pytest:
    name: Pytest (tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # See the mypy job above for why pytest-homeassistant-custom-component
      # is pinned to 0.13.294 and pycares to <5.
      - run: pip install pytest-homeassistant-custom-component==0.13.294 aioratio[ble]==0.13.0 aiousbwatcher "pycares<5"
      - run: pytest --cov-fail-under=92

  hassfest:
    name: Hassfest (HA manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -rf tests
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS (store layout validation)
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
